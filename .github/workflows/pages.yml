# Publishes the web game to GitHub Pages on every push to main.
# The mario/ folder is copied to the gh-pages branch, which GitHub Pages serves,
# so the game lives at the site's home page: https://tevtevyo.github.io/Games/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mario/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset URLs with the commit so browsers never use a stale cache
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" mario/index.html
      - name: Publish mario/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mario
          exclude_assets: ".claude,build.sh"
          force_orphan: true
          enable_jekyll: false
