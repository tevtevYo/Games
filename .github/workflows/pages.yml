# Publishes the web games to GitHub Pages on every push to main.
# The site root is the mario/ folder, so the game lives at the site's home page.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mario/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: mario
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
