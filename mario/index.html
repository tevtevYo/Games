<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Plumber Bros</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <span id="hud-score">SCORE 000000</span>
      <span id="hud-coins">COINS x00</span>
      <span id="hud-world">WORLD 1-1</span>
      <span id="hud-time">TIME 400</span>
      <span id="hud-lives">LIVES x3</span>
    </div>
    <canvas id="game" width="800" height="480"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">SUPER PLUMBER BROS</h1>
      <p id="overlay-text">Press ENTER or SPACE to start</p>
      <p class="controls">
        Move: &larr; &rarr; or A / D &nbsp;|&nbsp; Jump: &uarr; / W / SPACE &nbsp;|&nbsp; Run: SHIFT<br />
        Stomp enemies, grab coins, hit ? blocks, reach the flag!
      </p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
