<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Super Plumber Bros</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <span id="hud-score">SCORE 000000</span>
      <span id="hud-coins">COINS x00</span>
      <span id="hud-world">WORLD 1-1</span>
      <span id="hud-time">TIME 400</span>
      <span id="hud-lives">LIVES x3</span>
    </div>
    <canvas id="game" width="800" height="480"></canvas>
    <div id="overlay">
      <h1 id="overlay-title">SUPER PLUMBER BROS</h1>
      <p id="overlay-text">Press ENTER or SPACE to start</p>
      <p class="controls">
        Move: &larr; &rarr; or A / D &nbsp;|&nbsp; Jump: &uarr; / W / SPACE &nbsp;|&nbsp; Run: SHIFT &nbsp;|&nbsp; Fire: X<br />
        Stomp enemies, grab coins, hit ? blocks for mushrooms, reach the flag!
      </p>
    </div>
  </div>
  <!-- On-screen controls, shown only on touch devices -->
  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button type="button" data-key="ArrowLeft" aria-label="Move left">&#9664;</button>
      <button type="button" data-key="ArrowRight" aria-label="Move right">&#9654;</button>
    </div>
    <div class="actions">
      <button type="button" data-key="ShiftLeft" class="run" aria-label="Run">RUN</button>
      <button type="button" data-key="Space" class="jump" aria-label="Jump">JUMP</button>
    </div>
  </div>
  <button type="button" id="fullscreen" aria-label="Full screen" title="Full screen">&#x26F6;</button>
  <script src="game.js"></script>
</body>
</html>
